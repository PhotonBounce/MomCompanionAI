

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("com.github.triplet.play") version "3.9.0"
}

apply from: "publish.gradle.kts"

// Signing: reads keystore/friendai-upload.jks via keystore.properties at the repo root.
// Both files are git-ignored. If keystore.properties is missing, release builds stay
// unsigned (CI-friendly) — generate a keystore and the file to enable signing.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Optional bundled Gemini key so the app uses real AI out-of-the-box, with no caregiver
// setup. Read from gemini.properties at the repo root (git-ignored, never committed).
// If the file is absent the field is empty and the app falls back to the offline engine,
// exactly as before. A caregiver-entered key in Settings always takes precedence.
def geminiPropsFile = rootProject.file("gemini.properties")
def geminiProps = new Properties()
if (geminiPropsFile.exists()) { geminiPropsFile.withInputStream { geminiProps.load(it) } }
def defaultGeminiKey = geminiProps.getProperty("geminiApiKey", "")
// Optional bundled Claude/Anthropic key (property "anthropicApiKey", starts with "sk-ant-").
def defaultAnthropicKey = geminiProps.getProperty("anthropicApiKey", "")
// Optional bundled ElevenLabs key (property "elevenLabsApiKey") for premium cloud voice.
def defaultElevenLabsKey = geminiProps.getProperty("elevenLabsApiKey", "")

android {
    namespace 'com.friendai'
    compileSdk 36
    buildToolsVersion "36.0.0"

    buildFeatures {
        buildConfig true
    }

    if (keystorePropsFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.friendai"
        minSdk 24
        targetSdk 36
        versionCode 17
        versionName "2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "DEFAULT_GEMINI_KEY", "\"${defaultGeminiKey}\""
        buildConfigField "String", "DEFAULT_ANTHROPIC_KEY", "\"${defaultAnthropicKey}\""
        buildConfigField "String", "DEFAULT_ELEVENLABS_KEY", "\"${defaultElevenLabsKey}\""
    }

    buildTypes {
        debug {
            // No applicationIdSuffix — keeps package com.friendai for easy adb/emulator testing
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        animationsDisabled = true
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

play {
    serviceAccountCredentials.set(file("google-play-service-account.json"))
    track.set("internal") // change to alpha/beta/production later
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    // Google Play Billing 8.x — required by Google Play (>= 8.0.0). The 8.0 upgrade changed
    // queryProductDetailsAsync to return a QueryProductDetailsResult (handled in VipActivity).
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // AndroidX Test and Espresso for UI tests and screenshots
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    testImplementation 'junit:junit:4.13.2'
}
