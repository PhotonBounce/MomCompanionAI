name: Android CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Builds the installable debug APK and uploads it as a downloadable artifact.
  # GitHub-hosted runners include the Android SDK and can reach dl.google.com,
  # so this is how we produce the tablet APK.
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Assemble debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: friendai-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Unit tests (non-blocking)
      run: ./gradlew testDebugUnitTest --stacktrace || echo "Unit tests failed — not blocking the APK artifact."
