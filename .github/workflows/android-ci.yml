name: Android CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Builds the installable debug APK and uploads it as a downloadable artifact.
  # GitHub-hosted runners include the Android SDK and can reach dl.google.com,
  # so this is how we produce the tablet APK.
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Assemble debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: friendai-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    # Publishes the APK to a GitHub Release so there's a clean, direct,
    # one-tap download link (no zip, no login for a public repo):
    #   https://github.com/PhotonBounce/MomCompanionAI/releases/download/debug-latest/app-debug.apk
    - name: Publish APK as a direct-download Release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete debug-latest --yes --cleanup-tag || true
        gh release create debug-latest app/build/outputs/apk/debug/*.apk \
          --title "Latest tablet APK (debug)" \
          --notes "Tap **app-debug.apk** below to download and install it on the tablet. Auto-built from the latest code." \
          --prerelease

    - name: Unit tests (non-blocking)
      run: ./gradlew testDebugUnitTest --stacktrace || echo "Unit tests failed — not blocking the APK artifact."
