name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ claude/resume-work-ftl7zx ]
    paths: [ '.github/workflows/apk.yml' ]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=$(ls app/build/outputs/apk/debug/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: momcompanion-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK to apk-output branch
        run: |
          cp "${{ steps.apk.outputs.path }}" /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-output
          cp /tmp/app-debug.apk app-debug.apk
          git add -f app-debug.apk
          git commit -m "CI build: debug APK [skip ci]"
          git push -f origin apk-output
