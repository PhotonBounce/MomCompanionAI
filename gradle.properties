android.useAndroidX=true
android.nonTransitiveRClass=true

# The offline engine (CompanionEngineHandlersB.kt / CompanionEngine.kt) is very
# large, so the Kotlin compiler and Gradle daemons need a bigger heap than the
# defaults or compilation OOMs ("Not enough memory to run compilation"). CI
# runners have 16 GB, so these are safe.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
