android.useAndroidX=true
android.nonTransitiveRClass=true

# The offline CompanionEngine sources are very large (tens of thousands of lines),
# which makes Kotlin IR generation memory-hungry. Give the Gradle and Kotlin
# daemons enough heap so compilation does not fail with OutOfMemoryError on CI
# runners with default heap sizes.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
